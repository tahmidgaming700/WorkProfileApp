<rect width="1400" height="1800" fill="#f1f3f6"/>
<rect x="25" y="20" width="1350" height="115" rx="22" class="red"/>
<text x="65" y="83" class="title">LONDON DOUBLE-DECKER BUS</text><text x="68" y="118" class="sub">Visual build guide • ordinary bricks + Technic-style wheels</text>
