<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1800" viewBox="0 0 1400 1800">
<defs><style>
.title{font: bold 54px Arial;fill:#fff}.sub{font:24px Arial;fill:#fff}.h{font:bold 30px Arial;fill:#fff}.t{font:22px Arial;fill:#222}.small{font:18px Arial;fill:#333}.red{fill:#c91520}.dark{fill:#24272b}.glass{fill:#18232d}.white{fill:#fff}.yellow{fill:#ffd52a}.line{stroke:#24272b;stroke-width:8;fill:none;stroke-linecap:round;stroke-linejoin:round}
